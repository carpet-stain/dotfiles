name: PR code review (advisory)

# Advisory code review of the PR diff by a NON-Anthropic model — a different
# model's eyes than the Claude that planned and implemented the change (see
# docs/adr/0025). Deliberately NOT a required status check: an LLM reviewer
# false-positives, and a rate-limit or outage must never block a merge, so
# human approval stays the gate.
#
# Plan-conformance review (#458): a PR closing a `plan-approved` issue gets
# that issue's consolidated plan (approach + acceptance criteria) fetched via
# GraphQL `closingIssuesReferences` and prepended to the review prompt as the
# spec to check the diff against — a soldier PR can faithfully misimplement
# an approved plan, and a diff-only review can't see that. Auto-triggers on
# any PR closing a plan-approved issue; `needs-review` requests it on demand
# for anything else — a standalone opt-in, unrelated to `architecture`'s
# ADR-required meaning (adr-guard.yml owns that label; the two used to share
# one label, see #456 for why that broke). Both checks live in run.mjs
# itself (one GraphQL call decides eligibility and supplies the plan
# context), so this job always starts but exits before any OpenAI call for a
# PR that qualifies under neither trigger.
#
# The reviewer targets any OpenAI-compatible chat-completions endpoint, set by
# OPENAI_API_URL / OPENAI_MODEL below. It points at OpenRouter, routed to a
# paid frontier model rather than the free tier the reviewer trialed at $0
# under (#490) — conformance review (below) is judgment work, not
# lint-adjacent nits, so it's matched to a model that can actually compare a
# diff against an approved plan. To move to the OpenAI API directly, drop
# those two env lines (run.mjs defaults to gpt-4o-mini on api.openai.com) and
# point the guard/fetch steps below at an OpenAI key instead. The key comes
# from AWS SSM (`/runtime/openrouter-api-key`) via the OIDC-assumed role in
# `vars.AWS_OPENROUTER_ROLE_ARN` (infra#220) — no repo secret to rotate by
# hand, since carpet-stain is a User account with no shared org secret
# store. A role-assume or SSM fetch failure skips the review cleanly
# (green), it doesn't fail the job — advisory, never merge-blocking.
#
# DIY step (scripts/pr-review/), not a third-party Action: #330's upgrade
# over the anc95/ChatGPT-CodeReview action this replaced. That action
# batched comments per file with no real suggestion-block anchoring, so its
# `suggestion` blocks posted as copy-pasteable code, not GitHub's
# one-click-applyable kind (those need exact per-line anchoring via
# pulls.createReview's `comments` array). scripts/pr-review/run.mjs calls
# the GitHub REST API and an OpenAI-compatible chat API directly — no
# third-party Action holding the key or reading the diff — and posts real
# per-line suggestions. See
# scripts/pr-review/build-review.test.mjs for its unit-tested logic and the
# PR discussion for #330 for the design tradeoffs (file/prompt-size caps,
# single-line-only suggestions).

on:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # continue-on-error: this is the advisory reviewer's credential path,
      # never merge-blocking — a role-assume failure falls through to the
      # guard step below, which skips the review instead of failing the job.
      - name: Assume the OpenRouter key read role via OIDC
        id: aws-creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OPENROUTER_ROLE_ARN }}
          aws-region: us-east-1
      - name: Fetch the review API key from SSM
        id: guard
        run: |
          if [ "${{ steps.aws-creds.outcome }}" != "success" ]; then
            echo "::warning::OIDC role assume failed — advisory review skipped."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          key="$(aws ssm get-parameter --name /runtime/openrouter-api-key --with-decryption --query Parameter.Value --output text 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ] || [ -z "$key" ]; then
            echo "::warning::openrouter-api-key SSM fetch failed — advisory review skipped."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          else
            echo "::add-mask::$key"
            echo "OPENAI_API_KEY=$key" >>"$GITHUB_ENV"
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: "20"
      - name: Advisory review
        if: steps.guard.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OPENAI_API_KEY itself rides $GITHUB_ENV from the guard step above
          # (fetched from SSM), not a secrets.* reference.
          # OpenRouter (see header note to switch to the OpenAI API directly).
          # gpt-5.6-sol is the flagship of OpenAI's GPT-5.6 series as of #490
          # (verified live against openrouter.ai/api/v1/models, not recalled
          # from training data) — re-verify against
          # openrouter.ai/models?supported_parameters=structured_outputs if
          # this ID 404s, since OpenRouter's lineup rotates.
          OPENAI_API_URL: https://openrouter.ai/api/v1/chat/completions
          OPENAI_MODEL: openai/gpt-5.6-sol
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-review/run.mjs
