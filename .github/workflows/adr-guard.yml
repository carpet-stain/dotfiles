name: ADR guard

# Thin caller — the guard body lives in the template source repo's
# reusable-adr-guard.yml (its ADR-0004); Dependabot bumps the SHA pin.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: adr-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id `guards` is ruleset contract: the required context is
  # `guards / adr guard` — renaming this id breaks the ruleset.
  guards:
    uses: carpet-stain/project-starter-template/.github/workflows/reusable-adr-guard.yml@c970349d6020f06e0769e901879c3ba70b3243f4 # main
