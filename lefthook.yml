# Local shift-left mirror of what CI enforces (ci.yml, pr-guards.yml) — catches
# the same issues before push instead of after. Install with `lefthook install`
# (installed via macos/Brewfile.dev's `lefthook` formula).
pre-commit:
  jobs:
    - name: zsh-syntax
      glob:
        - "zsh/.zshenv"
        - "zsh/.zshrc"
        - "zsh/rc.d/**"
        - "zsh/env.d/**"
        - "zsh/fpath/**"
        - "macos/deploy.zsh"
      run: zsh -n {staged_files}

    - name: shfmt
      glob:
        - "linux/*.sh"
        - "scripts/*.sh"
        - "claude/skills/**/*.sh"
      run: shfmt -i 2 -ci -d {staged_files}

    - name: shellcheck
      glob:
        - "linux/*.sh"
        - "scripts/*.sh"
        - "claude/skills/**/*.sh"
        - ".envrc"
        - ".envrc.local.example"
      run: shellcheck {staged_files}

    - name: actionlint
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
      run: actionlint {staged_files}

    - name: brewfile-tiers
      glob:
        - "macos/Brewfile.payload"
        - "macos/Brewfile.dev"
        - "macos/Brewfile.personal"
        - "linux/Aptfile"
        - "linux/deploy.sh"
      run: scripts/check-brewfile-tiers.sh

    - name: lua-format
      glob:
        - "nvim/*.lua"
        - "nvim/**/*.lua"
      run: stylua --check {staged_files}

    - name: lua-lint
      glob:
        - "nvim/*.lua"
        - "nvim/**/*.lua"
      run: selene --config nvim/selene.toml {staged_files}

    - name: comment-concision
      glob:
        - "zsh/.zshenv"
        - "zsh/.zshrc"
        - "zsh/rc.d/**"
        - "zsh/env.d/**"
        - "macos/deploy.zsh"
        - "linux/*.sh"
        - "scripts/*.sh"
        - "nvim/*.lua"
        - "nvim/**/*.lua"
      run: scripts/check-comment-concision.sh {staged_files}

    - name: toml-format
      glob:
        - "*.toml"
        - "nvim/*.toml"
      run: taplo fmt --check {staged_files}

    - name: toml-lint
      glob:
        - "*.toml"
        - "nvim/*.toml"
      run: taplo lint {staged_files}

    - name: yaml-format
      glob:
        - "*.yml"
        - "*.yaml"
        - "**/*.yml"
        - "**/*.yaml"
      run: yamlfmt -lint {staged_files}

    - name: md-format
      glob:
        - "*.md"
        - "**/*.md"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      run: prettier --check {staged_files}

    - name: markdownlint
      glob:
        - "*.md"
        - "**/*.md"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      run: markdownlint-cli2 {staged_files}

    - name: justfile-format
      glob:
        - "justfile"
      # --justfile (not a positional, which `just` reads as a recipe name);
      # --fmt --check validates syntax (it must parse to format) and canonical
      # formatting in one pass.
      run: just --fmt --check --justfile {staged_files}

    - name: editorconfig
      glob:
        - "*"
        - "**/*"
      exclude:
        - "theme/**"
        - "zellij/themes/catppuccin.kdl"
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      # The catch-all for files no dedicated formatter covers (zsh, git/config,
      # ssh/config, plain rc files): enforces .editorconfig's unambiguous rules
      # — trailing whitespace, final newline, line endings. Indent checks are
      # off (--disable-indentation): indent_size false-positives on prose, and
      # indent_style on legitimately-tabbed files (.gitmodules, terminfo,
      # required `<<-` heredoc tabs); indentation stays each per-language
      # formatter's job (shfmt/stylua/taplo/prettier), which understands its own
      # syntax. Vendored (theme/**, catppuccin.kdl) and generated/heredoc files
      # (CHANGELOG, agent-memory) excluded, matching the markdown jobs.
      run: editorconfig-checker --disable-indentation {staged_files}

    - name: envrc-local-example-sync
      run: scripts/check-envrc-local-example.sh

pre-push:
  jobs:
    - name: envrc-local-example-sync
      run: scripts/check-envrc-local-example.sh
